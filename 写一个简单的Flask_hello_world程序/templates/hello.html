<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        .greeting {
            text-align: center;
            font-size: 2.5em;
        }
    </style>
</head>
<body>
    <div class="greeting">
        <h1>Hello, {{ name }}! 👋</h1>
        <p>Welcome to Flask!</p>
        <a href="/" style="color: white;">返回首页</a>
    </div>
</body>
</html>
